databases:
  - name: url_shortener_db
    databaseName: url_shortener
    user: postgres
    plan: free

services:
  - type: web
    name: url-shortener-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: url_shortener_db
          property: connectionString
      - key: BASE_URL
        # On Render, you will need to manually set this in the dashboard to your generated service URL after creation, 
        # or it can be derived. Render automatically sets RENDER_EXTERNAL_URL.
        value: "https://your-service-name.onrender.com"
      - key: PYTHON_VERSION
        value: 3.11.0
